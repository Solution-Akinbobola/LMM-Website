<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>LMM : Legends of Minimiltia</title>

    <!-- LMM FAVICON -->
    <link
      rel="icon"
      href="/favicon.svg?v=3"
      type="image/svg+xml"
    />

    <link
      rel="shortcut icon"
      href="/favicon.svg?v=3"
      type="image/svg+xml"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg?v=3"
    />

    <!-- BROWSER THEME -->
    <meta
      name="theme-color"
      content="#050505"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="LMM — Legends of Minimiltia. Join the community, follow our matches and become part of the legends."
    />

    <!-- OPEN GRAPH
         Used when LMM links are shared on WhatsApp,
         Facebook, Discord and other platforms.
         
         IMPORTANT:
         This image is NOT displayed on the website.
         It is only used for link previews.
    -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="LMM — Legends of Minimiltia"
    />

    <meta
      property="og:description"
      content="Join the Legends. Follow LMM matches and become part of the community."
    />

    <meta
      property="og:image"
      content="/lmm-preview.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- TWITTER / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="LMM — Legends of Minimiltia"
    />

    <meta
      name="twitter:description"
      content="Join the Legends. Follow LMM matches and become part of the community."
    />

    <meta
      name="twitter:image"
      content="/lmm-preview.jpg"
    />
  </head>
